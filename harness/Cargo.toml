[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Test harness and CLI for nanna-coder AI assistant"
repository.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[features]
# Gate the eval runner and its tempfile dependency behind this feature so that
# production builds (the harness binary, container images) do not pull in
# tempfile unless explicitly requested.
eval-runner = ["tempfile"]

[dependencies]
async-trait = "0.1"
clap = { version = "4.0", features = ["derive"] }
image-builder = { path = "../image-builder" }
model = { path = "../model" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3.4"
rand = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }
git2 = "0.20"
glob = "0.3"
regex = "1.0"
tempfile = { version = "3.0", optional = true }
toml = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking"] }

[lints]
workspace = true

[dev-dependencies]
futures = "0.3"
serial_test = "3.4"
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "agents_md_load"
harness = false

[[test]]
name = "eval_case_tests"

[[test]]
name = "eval_runner_tests"
required-features = ["eval-runner"]
