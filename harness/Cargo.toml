[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Test harness and CLI for nanna-coder AI assistant"
repository.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[features]
# Gate the eval runner and its tempfile dependency behind this feature so that
# production builds (the harness binary, container images) do not pull in
# tempfile unless explicitly requested.
eval-runner = ["tempfile"]

[dependencies]
async-trait = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
image-builder = { path = "../image-builder" }
model = { path = "../model" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
git2 = "0.20"
glob = "0.3"
regex = "1.0"
tempfile = { workspace = true, optional = true }
toml = "0.8"
reqwest = { workspace = true, features = ["blocking"] }

[lints]
workspace = true

[dev-dependencies]
futures = { workspace = true }
serial_test = "3.4"
tempfile = { workspace = true }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "agents_md_load"
harness = false

[[test]]
name = "eval_runner_tests"
required-features = ["eval-runner"]
