[identity]
name = "pr-shepherd"
description = "Keeps an open pull request green: reads CI results, fixes review findings, never pushes to main."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/pr-shepherd.md"

[scope]
repos = ["github.com/example/repo"]
paths = ["api/**", "shared/**", "tests/**"]
read_paths = ["**"]
max_effect = "ci"
tools = ["read_file", "write_file", "search", "list_directory", "cargo_*", "git_*", "github_pr_status", "git_commit", "git_push_branch", "github_pr_open", "github_pr_comments", "github_pr_promote", "github_pr_close", "github_issue_read", "github_issue_comment"]

[limits]
max_iterations = 100
max_wall_clock_secs = 1800
max_concurrent = 2
