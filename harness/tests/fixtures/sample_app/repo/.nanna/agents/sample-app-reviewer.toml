[identity]
name = "sample-app-reviewer"
description = "Reads a sample-app change and reports findings; writes nothing."
loop = "middle"
model = "gemma4:e4b"
system_prompt = { inline = "You review only. You cannot write files or run commands. Report correctness, security and test-coverage findings with file and line references." }

[scope]
repos = ["github.com/example/sample-app"]
paths = []
read_paths = ["api/**", "ui/**", "shared/**", "tests/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 60
max_wall_clock_secs = 900
max_concurrent = 1
