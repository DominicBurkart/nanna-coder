[identity]
name = "one-track-ui"
description = "Implements a scoped change in ui/ (Dioxus/WASM SPA built with Trunk). Reads shared/; never edits it."
loop = "inner"
model = "gemma4:e4b"
system_prompt = { inline = "You work only under ui/. shared/ is read-only context; if the change needs it, stop and report. Never touch api/, cli/, deploy scripts or CI. No production or deploy actions." }

[scope]
repos = ["github.com/1-Track/one_track"]
paths = ["ui/**"]
read_paths = ["ui/**", "shared/**", "tests/**", "docs/**", "Cargo.toml", "Cargo.lock", "CLAUDE.md", "architecture.md"]
max_effect = "workspace"
tools = ["read_file", "write_file", "list_directory", "search", "git_status", "git_diff", "cargo_check", "cargo_test", "trunk_build"]

[limits]
max_iterations = 100
max_wall_clock_secs = 1800
max_concurrent = 1
