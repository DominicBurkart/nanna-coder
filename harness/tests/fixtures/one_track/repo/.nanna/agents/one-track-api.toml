[identity]
name = "one-track-api"
description = "Implements a scoped change in api/ (Actix-web server, Postgres auth/state, e2ee endpoints). Reads shared/ and e2ee/; never edits them."
loop = "inner"
model = "gemma4:e4b"
system_prompt = { inline = "You work only under api/. shared/ and e2ee/ are read-only context; if the change needs them, stop and report. Never touch ui/, cli/, deploy scripts or CI. No production or deploy actions." }

[scope]
repos = ["github.com/1-Track/one_track"]
paths = ["api/**"]
read_paths = ["api/**", "shared/**", "e2ee/**", "tests/**", "docs/**", "Cargo.toml", "Cargo.lock", "CLAUDE.md", "architecture.md"]
max_effect = "workspace"
tools = ["read_file", "write_file", "list_directory", "search", "git_status", "git_diff", "cargo_check", "cargo_test"]

[limits]
max_iterations = 100
max_wall_clock_secs = 1800
max_concurrent = 1
