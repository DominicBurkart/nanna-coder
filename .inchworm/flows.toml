[[flow]]
name = "issue"
trigger = { kind = "label", label = "inchworm" }
base = "main"
max_attempts = 3

[[flow.step]]
name = "implement"
identity = "rust-implementer"

[[flow.step]]
name = "publish"
identity = "pr-shepherd"

[[flow.judge]]
kind = "diff"
max_lines = 400
forbid_paths = [
  ".github/**",
  "scripts/deploy.sh",
  "auto-issue-pr.sh",
  "CACHIX_SETUP.md",
  "codecov.yml",
  ".nanna/**",
  ".inchworm/**",
  ".github/CODEOWNERS",
]

[[flow.judge]]
kind = "nanna_clean"

[[flow.judge]]
kind = "llm"
rubric = ".inchworm/rubric.md"
model = "gemma4:e4b"
min_score = 7

[flow.outcome]
mode = "draft_pr"
required_checks = [
  "All Checks Passed",
  "unit (ubuntu-latest)",
  "lint (ubuntu-latest)",
  "security (ubuntu-latest)",
  "integration (ubuntu-latest)",
  "integration-container (ubuntu-latest)",
  "guard",
  "codecov/patch",
]
