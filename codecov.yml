coverage:
  status:
    project: off
    patch:
      default:
        # Relaxed from 100%: the #[ignore] e2e test and the
        # runtime-gated test_create_with_container_no_runtime exit early
        # in CI (no container runtime / Ollama available), so some new
        # container-dispatch branches are genuinely uncoverable there.
        target: 90%

ignore:
  - "harness/src/main.rs"
  # These test files contain only #[ignore]-gated E2E tests that run
  # under --run-ignored ignored-only on the integration-container job
  # (see .github/workflows/ci.yml). Default CI unit test runs never
  # execute them, so any new code in these files is genuinely
  # uncoverable by the codecov patch report. integration_tests.rs is
  # NOT listed here because it also contains many non-ignored tests.
  - "harness/tests/dev_container_integration.rs"
  - "harness/tests/nanna_self_dev_integration.rs"
  - "harness/tests/eval_case_runner_integration.rs"
