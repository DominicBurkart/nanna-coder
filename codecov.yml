coverage:
  status:
    project: off
    patch:
      default:
        # Hard floor — no in-repo override. Only a repo admin's force-merge
        # can bypass this. The regression guard in
        # .github/workflows/codecov-guard.yml blocks silent relaxations
        # (target decreases or `ignore:` list growth).
        target: 100%

ignore:
  - "harness/src/main.rs"
