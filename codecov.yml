coverage:
  status:
    project: off
    patch:
      default:
        # Relaxed from 100%: harness/src/main.rs is excluded (binary entry-point,
        # not unit-testable in isolation) and some infrastructure paths require
        # a live container runtime / Ollama that is unavailable in CI.
        target: 90%

ignore:
  - "harness/src/main.rs"
