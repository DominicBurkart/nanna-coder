[workspace]
resolver = "2"
members = ["api", "shared", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "shared" }

[profile.release]
opt-level = "s"
