# Ready-to-apply replacement for .github/workflows/eval.yml, adding the
# `sdlc-e2e` job for issue #657 (the eval portion of the SDLC orchestrator
# epic, #635). Agents may not write under .github/workflows/**, so a
# maintainer must copy this file over .github/workflows/eval.yml for the new
# job to run — everything above `sdlc-e2e` is the file's existing content,
# unchanged.
#
# `sdlc-e2e` drives harness::eval::sdlc::run_e2e_scenario (issue -> planner
# -> implementer PR -> shepherd promotes -> deploy plan executes against the
# fake adapter) via the `harness-sdlc-eval` binary. Unlike the `eval` job
# above, it needs no Ollama/model server and no GitHub token: the planner and
# the deploy step's action-gate model are a scripted ModelProvider, GitHub is
# a scripted in-memory GithubClient, and the deploy target is
# harness::rollout::FakeAdapter — see harness/src/eval/sdlc.rs's module docs.
# It appends a row to evals/scorecards/sdlc_e2e.jsonl and fails the job if
# the scenario's task_success is false.

name: Eval Suite

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to post results comment (optional)'
        required: false
        default: ''
      model:
        description: 'Model to use for evaluation'
        required: false
        default: 'gemma4:e4b'
        type: choice
        options:
          - gemma4:e4b
          - qwen3:0.6b
          - llama3.1:8b
      case_filter:
        description: 'Substring matched against case ID (optional; empty = run all)'
        required: false
        default: ''

jobs:
  eval:
    name: Run Eval Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Configure Cachix
      uses: cachix/cachix-action@v15
      with:
        name: nanna-coder
        authToken: ${{ secrets.CACHIX_AUTH }}
        pushFilter: "(-source$|nixpkgs\.tar\.gz$)"

    - name: Build release binary
      run: nix develop --command cargo build --release --workspace --all-features

    - name: Start Ollama and pull model
      env:
        MODEL: ${{ inputs.model }}
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        # Wait up to 60s for Ollama to be ready
        for i in $(seq 1 60); do
          ollama list > /dev/null 2>&1 && break
          sleep 1
        done
        if ! ollama list > /dev/null 2>&1; then
          echo "Ollama did not become ready within 60s"
          exit 1
        fi
        for attempt in 1 2 3; do
          echo "Pulling $MODEL (attempt $attempt/3)..."
          if timeout 600 ollama pull "$MODEL"; then
            echo "Pulled $MODEL"
            break
          fi
          if [ "$attempt" = "3" ]; then
            echo "Failed to pull $MODEL after 3 attempts"
            exit 1
          fi
          sleep $((attempt * 10))
        done

    - name: Run eval suite
      id: eval
      env:
        MODEL: ${{ inputs.model }}
        NANNA_EVAL_MODEL: ${{ inputs.model }}
        CASE_FILTER: ${{ inputs.case_filter }}
        # SWE-bench cases shell out to the installed `nanna` binary; point
        # the eval-runner at the workspace-built artefact rather than
        # whatever happens to be on PATH. The Build step above produces
        # this via `cargo build --release --workspace --all-features`.
        NANNA_HARNESS_BIN: ${{ github.workspace }}/target/release/nanna
      run: |
        echo "## Eval Results" > eval-results.md
        echo "" >> eval-results.md
        echo "**Model:** \`${MODEL}\`" >> eval-results.md
        echo "**Commit:** \`${{ github.sha }}\`" >> eval-results.md
        echo "**Triggered by:** @${{ github.actor }}" >> eval-results.md
        echo "" >> eval-results.md

        echo "### Eval cases" >> eval-results.md
        echo '```' >> eval-results.md

        set +e
        nix develop --command cargo run --release --bin harness-eval --features eval-runner -- \
          --filter "${CASE_FILTER}" \
          2>&1 | tee eval-output.txt
        EXIT_CODE=${PIPESTATUS[0]}
        set -e

        cat eval-output.txt >> eval-results.md
        echo '```' >> eval-results.md

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
          echo "" >> eval-results.md
          echo "**Status: PASSED**" >> eval-results.md
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
          echo "" >> eval-results.md
          echo "**Status: FAILED** (see logs above)" >> eval-results.md
        fi

    - name: Write eval summary
      if: always()
      run: cat eval-results.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post results as PR comment
      if: inputs.pr_number != ''
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ inputs.pr_number }}
        body-path: eval-results.md

    - name: Upload eval results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eval-results
        path: |
          eval-results.md
          eval-output.txt
        if-no-files-found: warn

  sdlc-e2e:
    name: Run SDLC End-to-End Eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Configure Cachix
      uses: cachix/cachix-action@v15
      with:
        name: nanna-coder
        authToken: ${{ secrets.CACHIX_AUTH }}
        pushFilter: "(-source$|nixpkgs\.tar\.gz$)"

    - name: Build harness-sdlc-eval
      run: nix develop --command cargo build --release -p harness --bin harness-sdlc-eval --features eval-runner

    - name: Run SDLC end-to-end eval
      id: sdlc_eval
      run: |
        echo "## SDLC End-to-End Eval" > sdlc-eval-results.md
        echo "" >> sdlc-eval-results.md
        echo "**Commit:** \`${{ github.sha }}\`" >> sdlc-eval-results.md
        echo "**Triggered by:** @${{ github.actor }}" >> sdlc-eval-results.md
        echo "" >> sdlc-eval-results.md
        echo "### issue -> planner -> implementer PR -> shepherd promotes -> deploy" >> sdlc-eval-results.md
        echo '```' >> sdlc-eval-results.md

        set +e
        PR_ARGS=()
        if [ -n "${{ inputs.pr_number }}" ]; then
          PR_ARGS=(--pr "${{ inputs.pr_number }}")
        fi
        nix develop --command ./target/release/harness-sdlc-eval \
          --scorecard-path evals/scorecards/sdlc_e2e.jsonl \
          "${PR_ARGS[@]}" \
          2>&1 | tee sdlc-eval-output.txt
        EXIT_CODE=${PIPESTATUS[0]}
        set -e

        cat sdlc-eval-output.txt >> sdlc-eval-results.md
        echo '```' >> sdlc-eval-results.md

        if [ "$EXIT_CODE" -eq 0 ]; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
          echo "" >> sdlc-eval-results.md
          echo "**Status: PASSED**" >> sdlc-eval-results.md
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
          echo "" >> sdlc-eval-results.md
          echo "**Status: FAILED** (see logs above)" >> sdlc-eval-results.md
        fi

    - name: Write SDLC eval summary
      if: always()
      run: cat sdlc-eval-results.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post SDLC eval results as PR comment
      if: inputs.pr_number != ''
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ inputs.pr_number }}
        body-path: sdlc-eval-results.md

    - name: Upload SDLC eval results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sdlc-eval-results
        path: |
          sdlc-eval-results.md
          sdlc-eval-output.txt
          evals/scorecards/sdlc_e2e.jsonl
        if-no-files-found: warn

    - name: Fail if the scenario did not succeed
      if: steps.sdlc_eval.outputs.outcome != 'success'
      run: exit 1
