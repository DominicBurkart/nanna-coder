name: "CI Metrics"
description: |
  Minimum-viable CI health monitoring primitive. Call this action TWICE per
  job: once near the start (with `phase: start`) and once at the end (with
  `phase: end`). On the `end` invocation it writes a markdown summary to
  $GITHUB_STEP_SUMMARY and uploads a JSON metrics artifact with 30-day
  retention, so trends and regressions can be computed by a downstream
  aggregator later.

  Captured fields (best-effort, no external services required):
    - workflow, job, run_id, run_attempt, run_number
    - os, arch, runner_name
    - ref, sha, event_name
    - start_ts, end_ts, duration_seconds
    - cache_hit (boolean, passed in by caller)
    - job_status (success / failure / cancelled — passed in by caller
      via the `job-status` input as `${{ job.status }}`; composite
      actions cannot reliably read the parent job's status context
      themselves)
    - matrix_key (optional caller-provided disambiguator for matrix
      cells that share a base metric-name)

  Dashboard, external monitoring, alerting, and regression detection are
  explicitly out of scope for this action. See issue #5 follow-ups.

inputs:
  phase:
    description: "'start' or 'end'. Call once with each per job."
    required: true
  cache-hit:
    description: |
      Boolean-ish string ('true' / 'false' / '') indicating whether the
      job's primary cache restore hit. Pass through from actions like
      actions/cache or cachix/cachix-action where available. Only read
      on the 'end' phase.
    required: false
    default: ""
  metric-name:
    description: |
      Logical name for this metric series (e.g. 'test-unit-linux',
      'build-container-harness'). Defaults to the GitHub job id.
    required: false
    default: ""
  artifact-name:
    description: |
      Override for the uploaded artifact name. Defaults to
      'ci-metrics-<run_id>-<run_attempt>-<metric-name-or-job>'.
      Note: the value is used literally — passing 'false' names the
      artifact 'false', not the derived default.
    required: false
    default: ""
  retention-days:
    description: "Artifact retention in days."
    required: false
    default: "30"
  job-status:
    description: |
      REQUIRED on the 'end' phase for an accurate failure-rate metric.
      Pass `${{ job.status }}` from the calling workflow — composite
      actions cannot read the parent job's status context themselves
      (the `job.status` expression is evaluated *before* the calling
      job's real steps run and will otherwise almost always be
      reported as 'success'). Leave empty on the 'start' phase.
    required: false
    default: ""
  matrix-key:
    description: |
      Optional disambiguator appended to the metric name / artifact
      name so that two matrix cells that share the same base
      `metric-name` (e.g. different OS / arch / feature flags) do not
      collide on file path or artifact name. Pass e.g.
      `${{ matrix.os }}-${{ matrix.arch }}` from the caller.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Validate phase input
      shell: bash
      run: |
        if [[ "${{ inputs.phase }}" != "start" && "${{ inputs.phase }}" != "end" ]]; then
          echo "::error::ci-metrics: invalid phase '${{ inputs.phase }}'; must be 'start' or 'end'"
          exit 1
        fi

    - name: Record start timestamp
      if: inputs.phase == 'start'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/ci-metrics"
        date -u +%s > "${RUNNER_TEMP}/ci-metrics/start_ts"
        echo "ci-metrics: start recorded at $(cat "${RUNNER_TEMP}/ci-metrics/start_ts")"

    - name: Compose metrics payload
      if: inputs.phase == 'end'
      id: compose
      shell: bash
      env:
        INPUT_CACHE_HIT: ${{ inputs.cache-hit }}
        INPUT_METRIC_NAME: ${{ inputs.metric-name }}
        INPUT_JOB_STATUS: ${{ inputs.job-status }}
        INPUT_MATRIX_KEY: ${{ inputs.matrix-key }}
      run: |
        set -euo pipefail
        metrics_dir="${RUNNER_TEMP}/ci-metrics"
        mkdir -p "${metrics_dir}"

        start_ts=0
        if [ -f "${metrics_dir}/start_ts" ]; then
          raw_ts="$(cat "${metrics_dir}/start_ts")"
          if [[ "${raw_ts}" =~ ^[0-9]+$ ]]; then
            start_ts="${raw_ts}"
          else
            echo "::warning::ci-metrics start_ts file contained non-numeric content ('${raw_ts}'); duration will be reported as 0" 1>&2
          fi
        else
          echo "::warning::ci-metrics end phase called without a matching start phase; duration will be reported as 0" 1>&2
        fi
        end_ts="$(date -u +%s)"
        if [[ "${start_ts}" =~ ^[0-9]+$ ]] && [ "${start_ts}" -gt 0 ]; then
          duration=$(( end_ts - start_ts ))
        else
          duration=0
        fi

        base_metric_name="${INPUT_METRIC_NAME:-${GITHUB_JOB}}"
        if [ -n "${INPUT_MATRIX_KEY}" ]; then
          metric_name="${base_metric_name}-${INPUT_MATRIX_KEY}"
        else
          metric_name="${base_metric_name}"
        fi

        # job_status: REQUIRE caller to pass ${{ job.status }} via the
        # job-status input. `job.status` evaluated inside a composite
        # action refers to the composite's own step status (which is
        # almost always 'success' at the moment it runs), so reading it
        # here would silently break the failure-rate metric.
        if [ -z "${INPUT_JOB_STATUS}" ]; then
          echo "::warning::ci-metrics end phase called without job-status input; failure-rate metric will be inaccurate. Pass job-status: \${{ job.status }} from the caller." 1>&2
          job_status="unknown"
        else
          job_status="${INPUT_JOB_STATUS}"
        fi

        # Sanitise to a safe filename fragment.
        safe_metric_name="$(printf '%s' "${metric_name}" | tr -c 'A-Za-z0-9_.-' '-')"
        # Guard against the (admittedly unlikely) empty result.
        if [ -z "${safe_metric_name}" ]; then
          safe_metric_name="ci-metric"
        fi

        payload="${metrics_dir}/${safe_metric_name}.json"

        # Build the JSON payload with jq so that metric-name /
        # matrix-key / cache-hit values that contain quotes, newlines,
        # or other JSON-significant characters cannot break the output
        # (defence against accidental or hostile injection).
        jq -n \
          --argjson schema_version 1 \
          --arg workflow       "${GITHUB_WORKFLOW:-}" \
          --arg job            "${GITHUB_JOB:-}" \
          --arg metric_name    "${metric_name}" \
          --arg run_id         "${GITHUB_RUN_ID:-}" \
          --arg run_attempt    "${GITHUB_RUN_ATTEMPT:-}" \
          --arg run_number     "${GITHUB_RUN_NUMBER:-}" \
          --arg event_name     "${GITHUB_EVENT_NAME:-}" \
          --arg ref            "${GITHUB_REF:-}" \
          --arg sha            "${GITHUB_SHA:-}" \
          --arg os             "${RUNNER_OS:-}" \
          --arg arch           "${RUNNER_ARCH:-}" \
          --arg runner_name    "${RUNNER_NAME:-}" \
          --arg matrix_key     "${INPUT_MATRIX_KEY}" \
          --argjson start_ts        "${start_ts}" \
          --argjson end_ts          "${end_ts}" \
          --argjson duration_seconds "${duration}" \
          --arg cache_hit      "${INPUT_CACHE_HIT}" \
          --arg job_status     "${job_status}" \
          '{
            schema_version: $schema_version,
            workflow: $workflow,
            job: $job,
            metric_name: $metric_name,
            matrix_key: $matrix_key,
            run_id: $run_id,
            run_attempt: $run_attempt,
            run_number: $run_number,
            event_name: $event_name,
            ref: $ref,
            sha: $sha,
            os: $os,
            arch: $arch,
            runner_name: $runner_name,
            start_ts: $start_ts,
            end_ts: $end_ts,
            duration_seconds: $duration_seconds,
            cache_hit: $cache_hit,
            job_status: $job_status
          }' > "${payload}"

        echo "payload_path=${payload}" >> "${GITHUB_OUTPUT}"
        echo "safe_metric_name=${safe_metric_name}" >> "${GITHUB_OUTPUT}"

        {
          echo "## CI Metrics: \`${metric_name}\`"
          echo
          echo "| field | value |"
          echo "|-------|-------|"
          echo "| workflow | \`${GITHUB_WORKFLOW:-}\` |"
          echo "| job | \`${GITHUB_JOB:-}\` |"
          echo "| os / arch | \`${RUNNER_OS:-}/${RUNNER_ARCH:-}\` |"
          echo "| duration (s) | ${duration} |"
          echo "| cache hit | \`${INPUT_CACHE_HIT:-unknown}\` |"
          echo "| job status | \`${job_status}\` |"
          echo "| sha | \`${GITHUB_SHA:-}\` |"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload metrics artifact
      if: inputs.phase == 'end'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('ci-metrics-{0}-{1}-{2}', github.run_id, github.run_attempt, steps.compose.outputs.safe_metric_name) }}
        path: ${{ steps.compose.outputs.payload_path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn
