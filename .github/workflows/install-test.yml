name: Install Test

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - run: shellcheck -x scripts/install.sh

  ps1-lint:
    name: PSScriptAnalyzer install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity @('Error','Warning')
          $issues | Format-Table -AutoSize
          $errors = $issues | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) { throw "PSScriptAnalyzer errors found" }

  ps1-parse:
    name: install.ps1 PowerShell parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; throw "install.ps1 has parse errors" }
          Write-Host "install.ps1 parses cleanly"

  build-images:
    name: Build harness + ollama images (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nanna-coder
          authToken: ${{ secrets.CACHIX_AUTH }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build images
        run: |
          nix build .#harnessImage --print-build-logs
          nix build .#ollamaImage  --print-build-logs

      - name: Export to docker-archive tarballs
        run: |
          # The flake's nix2container exposes copyToDockerDaemon (proven in
          # ci.yml). docker-archive is portable: podman load understands it
          # natively, so the same artifact works on Linux + WSL + colima.
          nix run .#harnessImage.copyToDockerDaemon
          nix run .#ollamaImage.copyToDockerDaemon
          mkdir -p _images
          docker save nanna-coder-harness:latest -o _images/harness.tar
          docker save nanna-coder-ollama:latest  -o _images/ollama.tar
          ls -lh _images/

      - uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: _images/*.tar
          retention-days: 1
          if-no-files-found: error

  linux-bringup:
    name: Linux full bring-up
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: _images
      - name: Install podman + load images
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y podman
          fi
          podman load -i _images/harness.tar
          podman load -i _images/ollama.tar
          podman images
      - name: Run installer
        run: |
          bash scripts/install.sh \
            --no-pull --skip-model-pull --yes \
            --harness-image nanna-coder-harness:latest \
            --ollama-image  nanna-coder-ollama:latest
      - name: Verify pod and ollama API
        run: |
          podman pod ps
          podman ps
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama API up"; exit 0
            fi
            sleep 2
          done
          echo "ollama did not come up in 60s"
          podman logs ollama-service || true
          exit 1
      - name: Tear down
        if: always()
        run: |
          podman pod stop nanna-coder-pod || true
          podman pod rm   nanna-coder-pod || true

  macos-bringup:
    name: macOS full bring-up (colima + x86_64 emulation)
    runs-on: macos-latest
    needs: build-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: _images

      - name: Install podman + colima
        run: |
          # macos-latest is arm64 (Apple Silicon). We built x86_64-linux
          # containers above, so the macOS lane runs an emulated x86_64 VM
          # via colima with the podman runtime. colima is the standard
          # podman/docker-on-mac VM manager and is far more reliable in CI
          # than `podman machine` on arm64 GHA runners.
          brew install podman colima docker

      - name: Start colima with podman runtime, x86_64 arch
        run: |
          # 4 GiB / 2 CPUs is enough for ollama serve + small ops.
          # qemu emulation is slow but functional for bring-up smoke.
          colima start --runtime podman --arch x86_64 --cpu 2 --memory 4 --disk 20
          colima status
          podman info | head -40

      - name: Load images
        run: |
          podman load -i _images/harness.tar
          podman load -i _images/ollama.tar
          podman images

      - name: Run installer (skip podman-machine path inside install.sh)
        env:
          # install.sh detects macOS and tries `podman machine init/start`.
          # colima already provides the VM, so neuter that path with an env
          # flag the script honors.
          NANNA_SKIP_PODMAN_MACHINE: "1"
        run: |
          bash scripts/install.sh \
            --no-pull --skip-model-pull --yes \
            --harness-image nanna-coder-harness:latest \
            --ollama-image  nanna-coder-ollama:latest

      - name: Verify pod and ollama API
        run: |
          podman pod ps
          podman ps
          # Emulated x86_64 ollama startup can take longer than native; allow 3 min.
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama API up"; exit 0
            fi
            sleep 2
          done
          echo "ollama did not come up in 180s"
          podman logs ollama-service || true
          exit 1

      - name: Tear down
        if: always()
        run: |
          podman pod stop nanna-coder-pod || true
          podman pod rm   nanna-coder-pod || true
          colima stop || true

  windows-bringup:
    name: Windows full bring-up (WSL2 + native apt podman)
    runs-on: windows-latest
    needs: build-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: _images

      - name: Set up WSL2 (Ubuntu 22.04)
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
          additional-packages: |
            curl
            ca-certificates
            podman
            uidmap
            slirp4netns

      - name: Load images inside WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          podman --version
          podman load -i _images/harness.tar
          podman load -i _images/ollama.tar
          podman images

      - name: Run installer inside WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          bash scripts/install.sh \
            --no-pull --skip-model-pull --yes \
            --harness-image nanna-coder-harness:latest \
            --ollama-image  nanna-coder-ollama:latest

      - name: Verify pod and ollama API inside WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          podman pod ps
          podman ps
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama API up"; exit 0
            fi
            sleep 2
          done
          echo "ollama did not come up in 60s"
          podman logs ollama-service || true
          exit 1

      - name: Tear down inside WSL
        if: always()
        shell: wsl-bash {0}
        run: |
          podman pod stop nanna-coder-pod || true
          podman pod rm   nanna-coder-pod || true

  install-test-gate:
    name: Install Test (gate)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - shellcheck
      - ps1-lint
      - ps1-parse
      - build-images
      - linux-bringup
      - macos-bringup
      - windows-bringup
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more install-test jobs failed or were cancelled"
          exit 1
