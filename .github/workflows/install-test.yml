name: Install Test

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - run: shellcheck -x scripts/install.sh

  ps1-lint:
    name: PSScriptAnalyzer install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity @('Error','Warning')
          $issues | Format-Table -AutoSize
          $errors = $issues | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) { throw "PSScriptAnalyzer errors found" }

  ps1-parse:
    name: install.ps1 PowerShell parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; throw "install.ps1 has parse errors" }
          Write-Host "install.ps1 parses cleanly"

  build-images:
    name: Build harness + ollama images (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nanna-coder
          authToken: ${{ secrets.CACHIX_AUTH }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build images
        run: |
          nix build .#harnessImage --print-build-logs
          nix build .#ollamaImage  --print-build-logs

      - name: Export to docker-archive tarballs
        run: |
          # The flake's nix2container exposes copyToDockerDaemon (proven in
          # ci.yml). docker-archive is portable: podman load understands it
          # natively, so the same artifact works on Linux + WSL + colima.
          nix run .#harnessImage.copyToDockerDaemon
          nix run .#ollamaImage.copyToDockerDaemon
          mkdir -p _images
          docker save nanna-coder-harness:latest -o _images/harness.tar
          docker save nanna-coder-ollama:latest  -o _images/ollama.tar
          ls -lh _images/

      - uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: _images/*.tar
          retention-days: 1
          if-no-files-found: error

  linux-bringup:
    name: Linux full bring-up
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: _images
      - name: Install podman + load images
        run: |
          set -x
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y podman
          fi
          podman --version
          podman info | head -20
          podman load -i _images/harness.tar
          podman load -i _images/ollama.tar
          # install.sh's resolve_image_ref() handles the localhost/ prefix
          # podman applies to short names, so no re-tag is needed here.
          podman images
      - name: Run installer
        run: |
          bash scripts/install.sh \
            --no-pull --skip-model-pull --yes \
            --harness-image nanna-coder-harness:latest \
            --ollama-image  nanna-coder-ollama:latest
      - name: Verify pod and ollama API
        if: always()
        run: |
          podman pod ps
          podman ps -a
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama API up"; exit 0
            fi
            sleep 2
          done
          echo "ollama did not come up in 60s"
          podman logs ollama-service || true
          exit 1
      - name: Tear down
        if: always()
        run: |
          podman pod stop nanna-coder-pod || true
          podman pod rm   nanna-coder-pod || true

  macos-smoke:
    name: macOS install smoke test (arm64, expected virtualization gap)
    # GitHub-hosted arm64 macOS runners don't expose Hypervisor.framework
    # to the guest at all (confirmed by GitHub's own docs and by
    # actions/runner-images#13505, closed "not planned"), so no podman
    # machine provider can work here regardless of packaging. This job
    # drives the real scripts/install.sh code path and hard-fails on any
    # sign of a real regression, but its "expected gap" pass accepts any
    # start-time failure once podman is installed and the script reached
    # the actual machine-start attempt -- it can't distinguish this
    # specific gap from a new, different start-time failure (an
    # entitlements problem, an image-pull failure, etc.); only real
    # hardware can. See docs/ci/macos-podman-bringup.md.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          set -x
          sw_vers
          uname -m
          # kern.hv_support reports "unknown oid" on this GitHub-hosted
          # arm64 guest (confirmed by a real run), so it can't classify
          # anything below -- kept here only as a diagnostic breadcrumb.
          # Whether that OID is genuinely absent on Apple Silicon in
          # general, or just in this hosted guest, is unconfirmed; check
          # on real hardware before reading anything into it either way.
          sysctl kern.hv_support || true
          brew --version
          command -v podman || true

      - name: Run installer and classify the result
        run: |
          set -x
          LOG="$(mktemp)"
          set +e
          bash scripts/install.sh --no-pull --skip-model-pull --yes --no-start >"$LOG" 2>&1
          install_status=$?
          set -e
          cat "$LOG"
          echo "install.sh exit status: $install_status"
          podman machine list --format '{{.Name}} {{.VMType}}' 2>/dev/null || true

          if podman machine list --format '{{.Running}}' 2>/dev/null | grep -qi true; then
            echo "::warning::podman machine is RUNNING on a GitHub-hosted arm64 runner. This isn't supposed to be possible today per GitHub's docs — see docs/ci/macos-podman-bringup.md. If this keeps happening, promote this job into a full pod bring-up test."
            podman machine list
            podman info | head -40
            exit 0
          fi

          if grep -qE 'executable file not found|could not find "' "$LOG"; then
            echo "::error::install.sh is missing a binary it should have installed itself (see the log above) — a real packaging regression, not the known virtualization gap. See docs/ci/macos-podman-bringup.md."
            exit 1
          fi

          if ! command -v podman >/dev/null 2>&1; then
            echo "::error::podman itself never got installed by install.sh — a real regression, not the known virtualization gap. See the log above and docs/ci/macos-podman-bringup.md."
            exit 1
          fi

          if ! grep -q 'starting podman machine' "$LOG"; then
            echo "::error::install.sh never reached the podman-machine-start step at all (see the log above) — that's earlier than the known virtualization gap and is a real regression. See docs/ci/macos-podman-bringup.md."
            exit 1
          fi

          echo "::notice::podman installed and install.sh's own machine-bring-up step ran; only the actual machine start failed — the known, tracked GitHub-hosted-runner virtualization gap. See docs/ci/macos-podman-bringup.md."

      - name: Tear down
        if: always()
        run: |
          podman machine stop || true

  macos-intel-probe:
    name: macOS Intel virtualization probe (diagnostic, non-blocking)
    # GitHub's nested-virtualization docs read as arm64-specific, so
    # this checks whether Intel-hosted runners behave differently.
    # Classifies its own result like macos-smoke does, but stays out of
    # the gate: Intel-hosted runners have historically had long queue
    # times on this repo. See docs/ci/macos-podman-bringup.md.
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      CONTAINERS_MACHINE_PROVIDER: applehv
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          set -x
          sw_vers
          uname -m
          sysctl kern.hv_support || true

      - name: Install podman and classify the result
        run: |
          set -x
          LOG="$(mktemp)"
          set +e
          brew install podman >"$LOG" 2>&1
          status=$?
          set -e
          cat "$LOG"

          if [ "$status" -eq 0 ]; then
            echo "::warning::brew install podman SUCCEEDED on macos-15-intel. Homebrew's podman formula previously required arm64 -- if this keeps happening, promote this job into a real Intel full bring-up lane. See docs/ci/macos-podman-bringup.md."
            podman --version
            set +e
            podman machine init --cpus=2 --memory=3072 --disk-size=10
            podman machine start
            bringup_status=$?
            set -e
            podman machine list || true
            podman info | head -40 || true
            exit "$bringup_status"
          fi

          if grep -qiE 'no bottle available|arm64 architecture is required' "$LOG"; then
            echo "::notice::Homebrew's podman formula still doesn't support macOS Intel (the known, tracked packaging gap -- independent of GitHub Actions, this also affects real Intel Mac users). See docs/ci/macos-podman-bringup.md."
            exit 0
          fi

          echo "::error::brew install podman failed with an error that doesn't match the known Intel packaging gap -- may be a new, different regression. See the log above and docs/ci/macos-podman-bringup.md."
          exit 1

      - name: Tear down
        if: always()
        run: |
          podman machine stop || true

  windows-bringup:
    name: "Windows install.sh WSL2 rejection (expected; issue 326)"
    runs-on: windows-latest
    needs: build-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: _images

      - name: Set up WSL2 (Ubuntu 24.04)
        uses: Vampire/setup-wsl@v3
        with:
          # Ubuntu-24.04 ships podman 4+, which correctly parses
          # docker-archive RepoTags. Ubuntu-22.04's apt podman is 3.4.4,
          # which has a known bug where loading a docker-archive whose
          # `RepoTags` is `name:latest` (no registry prefix) ends up
          # tagged as `localhost/latest:latest`, dropping the name.
          distribution: Ubuntu-24.04
          # Disable cache: the GHA cache service has been intermittently
          # returning 400 ("Our services aren't available right now"),
          # which makes setup-wsl fail on cache restore. Slower without
          # cache but reliable.
          use-cache: 'false'
          additional-packages: |
            curl
            ca-certificates
            podman
            uidmap
            slirp4netns
            catatonit

      - name: Load images inside WSL
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          # GHA env vars are not forwarded into wsl-bash; resolve the
          # workspace via the GHA expression context and translate the
          # Windows path (e.g. D:\a\repo\repo) to a WSL path (/mnt/d/...).
          ws=$(wslpath -u '${{ github.workspace }}')
          cd "$ws"
          uname -a
          dpkg -l | grep -E '^ii\s+(podman|uidmap|slirp4netns)' || true
          podman --version
          podman info | head -30 || true
          ls -lh _images/
          podman load -i _images/harness.tar
          podman load -i _images/ollama.tar
          podman images

      # `|| rc=$?` keeps the wsl-bash wrapper's inherited `-e` (setup-wsl's
      # default shell is `bash -euo pipefail`) from skipping the rc capture;
      # pipefail makes it install.sh's exit code, not tee's.
      - name: Run installer inside WSL
        id: installer
        continue-on-error: true
        shell: wsl-bash {0}
        run: |
          set -uo pipefail
          ws=$(wslpath -u '${{ github.workspace }}')
          cd "$ws"
          rc=0
          bash scripts/install.sh \
            --no-pull --skip-model-pull --yes \
            --harness-image nanna-coder-harness:latest \
            --ollama-image  nanna-coder-ollama:latest \
            2>&1 | tee _installer.log || rc=$?
          echo "$rc" > _installer.rc
          exit "$rc"

      # Passes only on the known-expected result (exit 1 + the die()
      # message); fails for real on anything else, including an unexpected
      # success (which would mean the #326 blocker is gone).
      - name: "Assert installer result (WSL2 early-exit; issue 326)"
        if: always()
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          ws=$(wslpath -u '${{ github.workspace }}')
          cd "$ws"
          outcome='${{ steps.installer.outcome }}'
          case "$outcome" in
            failure) ;;
            success)
              echo "::error::install.sh succeeded under WSL2 (outcome=$outcome) — the is_wsl() early-exit no longer fires. If #326 has been resolved and WSL2 bring-up is now genuinely supported, replace this assertion with a must-pass bring-up check; otherwise this is a regression."
              exit 1 ;;
            *)
              echo "installer step did not complete (outcome=${outcome:-unset}); see the earlier failing step for the real error."
              exit 0 ;;
          esac
          rc=$(cat _installer.rc 2>/dev/null || echo "")
          if [ "$rc" != "1" ]; then
            echo "::error::install.sh exited $rc, expected 1 (die() from the WSL2 early-exit)."
            cat _installer.log
            exit 1
          fi
          if ! grep -qF 'WSL2 detected; not supported by install.sh' _installer.log; then
            echo "::error::install.sh exited 1 but not with the expected WSL2 early-exit message. Full log:"
            cat _installer.log
            exit 1
          fi
          echo "install.sh correctly detected WSL2 (exit 1, expected message) and rejected it early — expected, by-design result (#326)."

      # Nothing to verify unless install.sh got past the WSL2 early-exit.
      - name: Verify pod and ollama API inside WSL
        if: always() && steps.installer.outcome == 'success'
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          podman pod ps
          podman ps -a
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama API up"; exit 0
            fi
            sleep 2
          done
          echo "ollama did not come up in 60s"
          podman logs ollama-service || true
          exit 1

      - name: Tear down inside WSL
        if: always() && steps.installer.outcome == 'success'
        shell: wsl-bash {0}
        run: |
          podman pod stop nanna-coder-pod || true
          podman pod rm   nanna-coder-pod || true

  install-test-gate:
    name: Install Test (gate)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - shellcheck
      - ps1-lint
      - ps1-parse
      - build-images
      - linux-bringup
      - macos-smoke
      - windows-bringup
    steps:
      # Gate enforces success on Linux + the lint/build jobs, plus
      # macos-smoke and windows-bringup, both now required outright:
      #
      # macos-smoke: its classifier has now been checked against real
      # macos-15 runs (podman installed cleanly from a Homebrew bottle,
      # install.sh reached and logged "starting podman machine", and the
      # classifier correctly emitted the "expected gap" notice and
      # exited 0), so a passing run means something real and it belongs
      # in the required set. See docs/ci/macos-podman-bringup.md for
      # those runs' actual output.
      #
      # windows-bringup's own "Assert installer result" step already
      # verifies install.sh's WSL2 early-exit fires correctly (#326): the
      # job reports success for that expected, by-design rejection and
      # fails for real on a regression or an unexpected error, so no
      # special-casing is needed here either.
      #
      # macos-intel-probe is deliberately left out of `needs:` entirely:
      # it's purely exploratory (see its job comment), and Intel-hosted
      # runners have historically had long queue times on this repo, so
      # the gate shouldn't wait on it. Its result is still visible as its
      # own check on the PR.
      - if: ${{ needs.shellcheck.result != 'success' || needs.ps1-lint.result != 'success' || needs.ps1-parse.result != 'success' || needs.build-images.result != 'success' || needs.linux-bringup.result != 'success' || needs.macos-smoke.result != 'success' || needs.windows-bringup.result != 'success' }}
        run: |
          echo "::error::Required install-test job failed"
          exit 1
