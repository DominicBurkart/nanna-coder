name: Install Test

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - run: shellcheck -x scripts/install.sh

  ps1-lint:
    name: PSScriptAnalyzer install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity @('Error','Warning')
          $issues | Format-Table -AutoSize
          $errors = $issues | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) { throw "PSScriptAnalyzer errors found" }

  ps1-parse:
    name: install.ps1 PowerShell parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; throw "install.ps1 has parse errors" }
          Write-Host "install.ps1 parses cleanly"

  build-images:
    name: Build harness + ollama images (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nanna-coder
          authToken: ${{ secrets.CACHIX_AUTH }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build images
        run: |
          nix build .#harnessImage --print-build-logs
          nix build .#ollamaImage  --print-build-logs

      - name: Export to docker-archive tarballs
        run: |
          # The flake's nix2container exposes copyToDockerDaemon (proven in
          # ci.yml). docker-archive is portable: podman load understands it
          # natively, so the same artifact works on Linux + WSL + colima.
          nix run .#harnessImage.copyToDockerDaemon
          nix run .#ollamaImage.copyToDockerDaemon
          mkdir -p _images
          docker save nanna-coder-harness:latest -o _images/harness.tar
          docker save nanna-coder-ollama:latest  -o _images/ollama.tar
          ls -lh _images/

      - uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: _images/*.tar
          retention-days: 1
          if-no-files-found: error

  linux-bringup:
    name: Linux full bring-up
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: _images
      - name: Install podman + load images
        run: |
          set -x
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y podman
          fi
          podman --version
          podman info | head -20
          podman load -i _images/harness.tar
          podman load -i _images/ollama.tar
          # install.sh's resolve_image_ref() handles the localhost/ prefix
          # podman applies to short names, so no re-tag is needed here.
          podman images
      - name: Run installer
        run: |
          bash scripts/install.sh \
            --no-pull --skip-model-pull --yes \
            --harness-image nanna-coder-harness:latest \
            --ollama-image  nanna-coder-ollama:latest
      - name: Verify pod and ollama API
        if: always()
        run: |
          podman pod ps
          podman ps -a
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama API up"; exit 0
            fi
            sleep 2
          done
          echo "ollama did not come up in 60s"
          podman logs ollama-service || true
          exit 1
      - name: Tear down
        if: always()
        run: |
          podman pod stop nanna-coder-pod || true
          podman pod rm   nanna-coder-pod || true

  macos-smoke:
    name: macOS install smoke test (arm64, expected virtualization gap)
    # GitHub-hosted arm64 macOS runners don't expose Hypervisor.framework
    # to the guest at all (confirmed by GitHub's own docs and by
    # actions/runner-images#13505, closed "not planned"), so no podman
    # machine provider can work here regardless of packaging. This job
    # drives the real scripts/install.sh code path and classifies the
    # result instead of full bring-up. See docs/ci/macos-podman-bringup.md.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          set -x
          sw_vers
          uname -m
          sysctl kern.hv_support || true
          brew --version
          command -v podman || true

      - name: Run installer and classify the result
        run: |
          set -x
          hv_support="$(sysctl -n kern.hv_support 2>/dev/null || echo unknown)"
          LOG="$(mktemp)"
          set +e
          bash scripts/install.sh --no-pull --skip-model-pull --yes --no-start >"$LOG" 2>&1
          install_status=$?
          set -e
          cat "$LOG"
          echo "install.sh exit status: $install_status, kern.hv_support: $hv_support"

          if podman machine list --format '{{.Running}}' 2>/dev/null | grep -qi true; then
            echo "::warning::podman machine is RUNNING on a GitHub-hosted arm64 runner (kern.hv_support=$hv_support). This isn't supposed to be possible today per GitHub's docs — see docs/ci/macos-podman-bringup.md. If this keeps happening, promote this job into a full pod bring-up test."
            podman machine list
            podman info | head -40
            exit 0
          fi

          if grep -q 'krunkit: executable file not found' "$LOG"; then
            echo "::error::krunkit is missing from PATH even though scripts/install.sh's ensure_krunkit_macos() should have installed it. This is a real regression, not the known virtualization gap — see docs/ci/macos-podman-bringup.md."
            exit 1
          fi

          if [ "$hv_support" = "0" ]; then
            echo "::notice::podman machine did not come up because kern.hv_support=0 (no Hypervisor.framework access on this runner) — the known, tracked gap. See docs/ci/macos-podman-bringup.md."
            exit 0
          fi

          echo "::error::podman machine did not come up, and kern.hv_support=$hv_support (not the known 0 case). This may be a real regression — see the log above and docs/ci/macos-podman-bringup.md."
          exit 1

      - name: Tear down
        if: always()
        run: |
          podman machine stop || true

  macos-intel-probe:
    name: macOS Intel virtualization probe (diagnostic, non-blocking)
    # GitHub's nested-virtualization docs read as arm64-specific, and
    # krunkit is arm64-only, so this checks whether Intel-hosted runners
    # (applehv provider) behave differently. Not wired into the gate.
    # See docs/ci/macos-podman-bringup.md.
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      CONTAINERS_MACHINE_PROVIDER: applehv
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          set -x
          sw_vers
          uname -m
          sysctl kern.hv_support || true

      - name: Install podman
        run: |
          set -x
          brew install podman
          podman --version

      - name: Attempt podman machine bring-up (applehv provider)
        run: |
          set -x
          set +e
          podman machine init --cpus=2 --memory=3072 --disk-size=10
          podman machine start
          status=$?
          set -e
          podman machine list || true
          podman info | head -40 || true
          exit "$status"

      - name: Tear down
        if: always()
        run: |
          podman machine stop || true

  windows-bringup:
    name: Windows full bring-up (WSL2 + native apt podman)
    runs-on: windows-latest
    needs: build-images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: _images

      - name: Set up WSL2 (Ubuntu 24.04)
        uses: Vampire/setup-wsl@v3
        with:
          # Ubuntu-24.04 ships podman 4+, which correctly parses
          # docker-archive RepoTags. Ubuntu-22.04's apt podman is 3.4.4,
          # which has a known bug where loading a docker-archive whose
          # `RepoTags` is `name:latest` (no registry prefix) ends up
          # tagged as `localhost/latest:latest`, dropping the name.
          distribution: Ubuntu-24.04
          # Disable cache: the GHA cache service has been intermittently
          # returning 400 ("Our services aren't available right now"),
          # which makes setup-wsl fail on cache restore. Slower without
          # cache but reliable.
          use-cache: 'false'
          additional-packages: |
            curl
            ca-certificates
            podman
            uidmap
            slirp4netns
            catatonit

      - name: Load images inside WSL
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          # GHA env vars are not forwarded into wsl-bash; resolve the
          # workspace via the GHA expression context and translate the
          # Windows path (e.g. D:\a\repo\repo) to a WSL path (/mnt/d/...).
          ws=$(wslpath -u '${{ github.workspace }}')
          cd "$ws"
          uname -a
          dpkg -l | grep -E '^ii\s+(podman|uidmap|slirp4netns)' || true
          podman --version
          podman info | head -30 || true
          ls -lh _images/
          podman load -i _images/harness.tar
          podman load -i _images/ollama.tar
          podman images

      - name: Run installer inside WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          ws=$(wslpath -u '${{ github.workspace }}')
          cd "$ws"
          bash scripts/install.sh \
            --no-pull --skip-model-pull --yes \
            --harness-image nanna-coder-harness:latest \
            --ollama-image  nanna-coder-ollama:latest

      - name: Verify pod and ollama API inside WSL
        if: always()
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          podman pod ps
          podman ps -a
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "ollama API up"; exit 0
            fi
            sleep 2
          done
          echo "ollama did not come up in 60s"
          podman logs ollama-service || true
          exit 1

      - name: Tear down inside WSL
        if: always()
        shell: wsl-bash {0}
        run: |
          podman pod stop nanna-coder-pod || true
          podman pod rm   nanna-coder-pod || true

  install-test-gate:
    name: Install Test (gate)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - shellcheck
      - ps1-lint
      - ps1-parse
      - build-images
      - linux-bringup
      - macos-smoke
      - windows-bringup
    steps:
      # Gate enforces success on Linux + the lint/build jobs.
      #
      # windows-bringup is intentionally allowed to fail: install.sh
      # exits early on WSL2 with a "not supported" message (see is_wsl()
      # in scripts/install.sh), so the Windows lane is expected to fail
      # in CI as the documented confirmation of that path. Tracked in #326.
      #
      # macos-smoke classifies its own result (see its job comment and
      # docs/ci/macos-podman-bringup.md) and is meant to become required
      # once its classifier has been checked against a real run's log —
      # not yet done as of this workflow revision, so it's still
      # allowed-to-fail pending that verification.
      #
      # macos-intel-probe is deliberately left out of `needs:` entirely:
      # it's purely exploratory (see its job comment), and Intel-hosted
      # runners have historically had long queue times on this repo, so
      # the gate shouldn't wait on it. Its result is still visible as its
      # own check on the PR.
      - if: ${{ needs.shellcheck.result != 'success' || needs.ps1-lint.result != 'success' || needs.ps1-parse.result != 'success' || needs.build-images.result != 'success' || needs.linux-bringup.result != 'success' }}
        run: |
          echo "::error::Required install-test job failed (linux/lint/build)"
          exit 1
      - if: ${{ needs.windows-bringup.result != 'failure' }}
        run: |
          echo "::warning::windows-bringup did not fail — install.sh's WSL2 early-exit may have regressed; verify is_wsl() still triggers."
