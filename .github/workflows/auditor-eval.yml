name: Auditor Eval (model-measured false-allow)

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model (any non-default input makes the run informational and non-gating)"
        required: false
        default: "gemma4:e4b"
      cases:
        description: "Cases directory (non-default makes the run informational)"
        required: false
        default: "evals/cases/auditor_heldout"
      max_cases:
        description: "Score only the first N cases (timing run; informational)"
        required: false
        default: ""
      max_false_allow:
        description: "Threshold (non-zero makes the run informational)"
        required: false
        default: "0"
      runs:
        description: "Model-only runs per case (anything but 3 makes the run informational)"
        required: false
        default: "3"

jobs:
  gate:
    name: Gate - model-only false-allow on the held-out set
    if: >-
      github.event_name == 'schedule' ||
      (inputs.model == 'gemma4:e4b' &&
       inputs.cases == 'evals/cases/auditor_heldout' &&
       inputs.max_cases == '' &&
       inputs.max_false_allow == '0' &&
       inputs.runs == '3')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: nanna-coder
          skipPush: true

      - name: Build nanna
        run: nix develop --command cargo build --release --bin nanna

      - name: Start Ollama and pull model
        shell: bash
        env:
          MODEL: gemma4:e4b
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 60); do
            ollama list > /dev/null 2>&1 && break
            sleep 1
          done
          ollama list > /dev/null 2>&1 || { echo "Ollama did not become ready within 60s"; exit 1; }
          for attempt in 1 2 3; do
            timeout 1200 ollama pull "$MODEL" && break
            [ "$attempt" = "3" ] && { echo "Failed to pull $MODEL"; exit 1; }
            sleep $((attempt * 10))
          done

      - name: Run auditor scorecard (gating)
        shell: bash
        env:
          NANNA_EVAL_MODEL: gemma4:e4b
        run: |
          set -o pipefail
          ./target/release/nanna auditor eval \
            --cases evals/cases/auditor_heldout \
            --max-false-allow 0 \
            --runs 3 \
            2>&1 | tee auditor-scorecard.txt

      - name: Write scorecard summary
        if: always()
        shell: bash
        run: |
          {
            echo '**Gate run**'
            echo '```'
            cat auditor-scorecard.txt 2>/dev/null || echo "no scorecard produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditor-scorecard
          path: auditor-scorecard.txt
          if-no-files-found: warn

  informational:
    name: Informational - non-gating, overridden inputs
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.model != 'gemma4:e4b' ||
       inputs.cases != 'evals/cases/auditor_heldout' ||
       inputs.max_cases != '' ||
       inputs.max_false_allow != '0' ||
       inputs.runs != '3')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: nanna-coder
          skipPush: true

      - name: Build nanna
        run: nix develop --command cargo build --release --bin nanna

      - name: Start Ollama and pull model
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 60); do
            ollama list > /dev/null 2>&1 && break
            sleep 1
          done
          ollama list > /dev/null 2>&1 || { echo "Ollama did not become ready within 60s"; exit 1; }
          for attempt in 1 2 3; do
            timeout 1200 ollama pull "$MODEL" && break
            [ "$attempt" = "3" ] && { echo "Failed to pull $MODEL"; exit 1; }
            sleep $((attempt * 10))
          done

      - name: Run auditor scorecard (informational, non-gating)
        continue-on-error: true
        shell: bash
        env:
          NANNA_EVAL_MODEL: ${{ inputs.model }}
          CASES: ${{ inputs.cases }}
          MAX_CASES: ${{ inputs.max_cases }}
          MAX_FALSE_ALLOW: ${{ inputs.max_false_allow }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -o pipefail
          echo "INFORMATIONAL RUN: inputs overridden; this is not the gating result" | tee auditor-scorecard.txt
          ./target/release/nanna auditor eval \
            --cases "$CASES" \
            --max-false-allow "$MAX_FALSE_ALLOW" \
            --runs "$RUNS" \
            ${MAX_CASES:+--max-cases "$MAX_CASES"} \
            2>&1 | tee -a auditor-scorecard.txt

      - name: Write scorecard summary
        if: always()
        shell: bash
        run: |
          {
            echo '**Informational run: not the gating result.**'
            echo '```'
            cat auditor-scorecard.txt 2>/dev/null || echo "no scorecard produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditor-scorecard-informational
          path: auditor-scorecard.txt
          if-no-files-found: warn
