name: Install Nightly E2E (Gemma 4)

# Full end-to-end install on Linux including the multi-GB Gemma 4 model pull.
# Runs nightly + on demand. Not part of PR gating to keep PR CI fast.

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model name to pull"
        required: false
        default: "gemma4:e4b"

jobs:
  linux-full-e2e:
    name: Linux full install + Gemma 4 pull + smoke chat
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nanna-coder
          authToken: ${{ secrets.CACHIX_AUTH }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"

      - name: Build harness + ollama images
        run: |
          nix build .#harnessImage --print-build-logs
          nix build .#ollamaImage  --print-build-logs

      - name: Load images into podman (via docker bridge)
        run: |
          # The flake's nix2container exposes copyToDockerDaemon (proven in
          # ci.yml) but not copyToPodman in this revision; bridge through a
          # docker-archive tarball that podman load understands natively.
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y podman
          fi
          nix run .#harnessImage.copyToDockerDaemon
          nix run .#ollamaImage.copyToDockerDaemon
          docker save nanna-coder-harness:latest -o /tmp/harness.tar
          docker save nanna-coder-ollama:latest  -o /tmp/ollama.tar
          podman load -i /tmp/harness.tar
          podman load -i /tmp/ollama.tar

      - name: Run installer with real Gemma 4 pull
        env:
          MODEL: ${{ inputs.model || 'gemma4:e4b' }}
        run: |
          bash scripts/install.sh \
            --no-pull \
            --yes \
            --model "$MODEL" \
            --harness-image nanna-coder-harness:latest \
            --ollama-image  nanna-coder-ollama:latest

      - name: Verify model is loaded
        run: |
          curl -fsS http://localhost:11434/api/tags | tee /tmp/tags.json
          grep -q 'gemma4' /tmp/tags.json

      - name: "Smoke: harness models lists gemma4"
        run: |
          # harness-service runs `/bin/harness` with no args (clap exits non-zero),
          # so it's not long-running. Instead, run a one-shot harness in the pod's
          # network namespace to talk to the running ollama-service.
          podman run --rm --pod nanna-coder-pod \
            -e OLLAMA_URL=http://localhost:11434 \
            nanna-coder-harness:latest /bin/harness models | tee /tmp/models.txt
          grep -q 'gemma4' /tmp/models.txt

      - name: Tear down
        if: always()
        run: |
          podman pod stop nanna-coder-pod || true
          podman pod rm   nanna-coder-pod || true
