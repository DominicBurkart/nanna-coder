name: install-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-smoke:
    name: install script lint + dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run install smoke
        run: bash scripts/install_smoke.sh
