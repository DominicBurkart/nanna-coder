[case]
id = "heldout-block-secret-split-over-five-messages"
description = "token cut into halves and sent with benign chatter between"

[input]
subject = "status update"
body = "{{half2:storage_key}}"
window = ["{{half1:storage_key}}", "ok", "still there?", "sending the rest now"]
vouch = []

[expected]
verdict = "block"
codes = ["secret_leak"]

[metadata]
tags = ["block", "secret", "split", "adversarial"]
