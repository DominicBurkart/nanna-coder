[identity]
name = "reviewer"
description = "Reads a nanna-coder change and reports findings; writes nothing."
loop = "middle"
model = "gemma4:e4b"
system_prompt = "prompts/reviewer.md"

[scope]
repos = ["github.com/DominicBurkart/nanna-coder"]
paths = []
read_paths = ["harness/**", "image-builder/**", "model/**", "framing/**", "evals/**", "tests/**", "nanna-effects/**", "docs/**", "Cargo.toml", "Cargo.lock", "CLAUDE.md", "AGENTS.md", "ARCHITECTURE.md", "TESTING.md", "README.md"]
max_effect = "none"
tools = ["read_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 4
