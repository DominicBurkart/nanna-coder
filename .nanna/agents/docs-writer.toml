[identity]
name = "docs-writer"
description = "Writes and updates markdown documentation only."
loop = "inner"
model = "gemma4:e4b"
system_prompt = { inline = "You edit only markdown documentation. Verify every claim against the code. Never edit source, configuration or CI." }

[scope]
repos = ["github.com/DominicBurkart/nanna-coder"]
paths = ["docs/**/*.md", "README.md", "ARCHITECTURE.md", "TESTING.md"]
read_paths = ["harness/**", "image-builder/**", "model/**", "framing/**", "evals/**", "tests/**", "nanna-effects/**", "docs/**", "Cargo.toml", "Cargo.lock", "CLAUDE.md", "AGENTS.md", "ARCHITECTURE.md", "TESTING.md", "README.md"]
max_effect = "workspace"
tools = ["read_file", "write_file", "list_directory", "search", "git_status", "git_diff"]

[limits]
max_iterations = 60
max_wall_clock_secs = 900
max_concurrent = 1
