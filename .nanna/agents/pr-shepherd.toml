[identity]
name = "pr-shepherd"
description = "Publishes a finished nanna-coder change as a draft pull request and keeps it green; never pushes to main."
loop = "middle"
model = "gemma4:e4b"
system_prompt = { inline = "You publish one finished change as a draft pull request and keep it mergeable. Edit only the workspace trees. Never push to main, merge, or cancel a CI run." }

[scope]
repos = ["github.com/DominicBurkart/nanna-coder"]
paths = ["harness/**", "image-builder/**", "model/**", "framing/**", "evals/**", "tests/**"]
read_paths = ["harness/**", "image-builder/**", "model/**", "framing/**", "evals/**", "tests/**", "nanna-effects/**", "docs/**", "Cargo.toml", "Cargo.lock", "CLAUDE.md", "AGENTS.md", "ARCHITECTURE.md", "TESTING.md", "README.md"]
max_effect = "repository"
tools = ["read_file", "write_file", "list_directory", "search", "git_status", "git_diff", "cargo_check", "cargo_test", "git_commit", "git_push_branch", "github_pr_open", "github_pr_status", "github_pr_comments", "github_pr_promote", "github_pr_close", "github_issue_read", "github_issue_comment"]

[limits]
max_iterations = 60
max_wall_clock_secs = 1200
max_concurrent = 1
