[role]
name = "reviewer"
description = "Reviews a {{stack.language}} change without writing files or running commands."
prompt = """
# reviewer

You review only. You cannot write files or run commands. Report correctness, security and test-coverage findings for this {{stack.language}} repository with file and line references, ordered by severity.
"""
tools = ["read_file", "grep", "list_directory", "finish"]
verbs = []
max_effect = "none"

[role.limits]
max_iterations = 200
max_wall_clock_secs = 3600
max_concurrent = 4
