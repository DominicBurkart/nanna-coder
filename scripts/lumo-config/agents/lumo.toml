[identity]
name = "lumo"
description = "Implements one scoped change requested from Lumo Desktop; workspace effect only, no network, no commit, push or pull request."
loop = "inner"
model = "gemma4:e4b"
system_prompt = "prompts/lumo.md"

[scope]
repos = ["github.com/DominicBurkart/marigold", "github.com/DominicBurkart/personal-site-actix", "github.com/DominicBurkart/nanna-coder", "github.com/1-Track/one_track"]
paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "src/**", "build.rs", "launcher/**", "harness/**", "image-builder/**", "model/**", "framing/**", "evals/**", "api/**", "ui/**", "shared/**", "e2ee/**", "cli/**"]
read_paths = ["marigold/**", "marigold-macros/**", "marigold-grammar/**", "marigold-lsp/**", "marigold-impl/**", "tests/**", "examples/**", "integrations/**", "docs/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "codecov.yml", "README.md", "install.sh", "publish.sh", "src/**", "build.rs", "launcher/**", "templates/**", "template_content/**", "raw_static_pages/**", "public/**", "rustfmt.toml", "CHECKS", "CLAUDE.md", "agents.md", "harness/**", "image-builder/**", "model/**", "framing/**", "evals/**", "nanna-effects/**", "AGENTS.md", "ARCHITECTURE.md", "TESTING.md", "api/**", "ui/**", "shared/**", "e2ee/**", "cli/**", "architecture.md"]
max_effect = "workspace"
tools = ["read_file", "write_file", "list_directory", "search", "git_status", "git_diff", "cargo_check", "cargo_test", "cargo_build"]

[limits]
max_iterations = 100
max_wall_clock_secs = 3600
max_concurrent = 1
